<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Banc d'essai — Préparation de test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;450;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F1F2EF;
    --card:#FBFBF9;
    --ink:#14161C;
    --ink-soft:#4A4E58;
    --ink-faint:#8A8E97;
    --line:#DEDFDA;
    --line-strong:#C9CAC4;
    --accent:#2A3BD4;      /* ultramarine — signature */
    --accent-ink:#1B2AA6;
    --amber:#D9772B;       /* on aime moins / alerte */
    --green:#1C9B6A;       /* validé */
    --shadow:0 1px 0 rgba(20,22,28,.04), 0 6px 24px -12px rgba(20,22,28,.18);
    --radius:14px;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--paper);
    color:var(--ink);
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
    letter-spacing:-.006em;
  }
  ::selection{background:var(--accent);color:#fff}
  .mono{font-family:'JetBrains Mono',monospace}
  .disp{font-family:'Space Grotesk',sans-serif}

  /* ---------- TOP BAR ---------- */
  header.topbar{
    position:sticky;top:0;z-index:40;
    background:rgba(241,242,239,.86);
    backdrop-filter:blur(12px);
    border-bottom:1px solid var(--line);
    padding:11px clamp(16px,3vw,34px);
    display:flex;align-items:center;gap:18px;
  }
  .brand{display:flex;align-items:center;gap:11px;flex-shrink:0}
  .brand .glyph{
    width:34px;height:34px;border-radius:9px;background:var(--ink);
    display:grid;place-items:center;position:relative;overflow:hidden;
  }
  .brand .glyph::before{
    content:"";position:absolute;inset:0;
    background:
      linear-gradient(90deg,transparent 46%,var(--accent) 46%,var(--accent) 54%,transparent 54%),
      linear-gradient(0deg,transparent 62%,var(--amber) 62%,var(--amber) 68%,transparent 68%);
    opacity:.9;
  }
  .brand .glyph b{position:relative;color:#fff;font-family:'Space Grotesk';font-weight:700;font-size:15px}
  .brand .wm{line-height:1.05}
  .brand .wm .t{font-family:'Space Grotesk';font-weight:700;font-size:15px;letter-spacing:.02em}
  .brand .wm .s{font-size:9.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-faint);font-weight:600}

  .topbar .ident{
    flex:1;min-width:0;display:flex;align-items:baseline;gap:10px;overflow:hidden;
  }
  .ident .prod{font-family:'Space Grotesk';font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ident .prod .ph{color:var(--ink-faint);font-weight:500}
  .ident .cat{font-size:11px;color:var(--ink-faint);white-space:nowrap}

  .prog{display:flex;align-items:center;gap:9px;flex-shrink:0}
  .prog .bar{width:96px;height:7px;border-radius:20px;background:var(--line-strong);overflow:hidden}
  .prog .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent-ink));transition:width .35s ease}
  .prog .pct{font-family:'JetBrains Mono';font-size:12px;font-weight:600;min-width:38px;text-align:right}

  .actions{display:flex;gap:9px;flex-shrink:0}
  button{font-family:inherit;cursor:pointer;border:none;transition:.14s}
  .btn{
    padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;
    display:inline-flex;align-items:center;gap:7px;
  }
  .btn.ghost{background:transparent;border:1px solid var(--line-strong);color:var(--ink-soft)}
  .btn.ghost:hover{border-color:var(--ink-soft);color:var(--ink)}
  .btn.solid{background:var(--accent);color:#fff}
  .btn.solid:hover{background:var(--accent-ink)}
  .btn svg{width:15px;height:15px}

  /* ---------- LAYOUT ---------- */
  .wrap{display:grid;grid-template-columns:268px 1fr;gap:clamp(16px,2.4vw,30px);
    max-width:1180px;margin:0 auto;padding:clamp(16px,2.6vw,30px) clamp(16px,3vw,34px) 90px;}

  /* ---------- SIDE NAV ---------- */
  aside{position:sticky;top:74px;align-self:start;height:fit-content}
  .navcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden;margin-bottom:16px}
  .navcard h3{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);font-weight:700;padding:13px 15px 7px}
  .navlist{padding:2px 8px 9px}
  .navitem{
    width:100%;text-align:left;background:transparent;border-radius:9px;
    padding:9px 10px;display:flex;align-items:center;gap:10px;color:var(--ink-soft);
    font-size:13.5px;font-weight:500;position:relative;
  }
  .navitem:hover{background:var(--paper)}
  .navitem.active{background:var(--ink);color:#fff}
  .navitem.active .idx{color:var(--accent)}
  .navitem.active .gge{background:rgba(255,255,255,.22)}
  .navitem .idx{font-family:'JetBrains Mono';font-size:10.5px;font-weight:700;color:var(--ink-faint);width:16px;flex-shrink:0}
  .navitem .lab{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .navitem .gge{width:30px;height:4px;border-radius:20px;background:var(--line-strong);overflow:hidden;flex-shrink:0}
  .navitem .gge i{display:block;height:100%;background:var(--green);width:0;transition:width .3s}
  .navitem.active .gge i{background:#fff}
  .navitem .chk{width:15px;height:15px;flex-shrink:0;opacity:0;transition:.2s}
  .navitem.done .chk{opacity:1;color:var(--green)}
  .navitem.active.done .chk{color:#7CE0B5}
  .navitem.done .gge{display:none}

  .drafts .navlist{padding:2px 8px 6px}
  .draftitem{width:100%;text-align:left;background:transparent;border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:2px}
  .draftitem:hover{background:var(--paper)}
  .draftitem.active{background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--accent)}
  .draftitem .dt{font-size:12.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .draftitem .dm{font-size:10.5px;color:var(--ink-faint);font-family:'JetBrains Mono'}
  .draftrow{display:flex;align-items:center;gap:6px}
  .draftrow .del{margin-left:auto;opacity:0;background:transparent;color:var(--ink-faint);padding:3px;border-radius:6px;line-height:0}
  .draftitem:hover .del{opacity:1}
  .draftrow .del:hover{color:var(--amber);background:var(--paper)}
  .newbtn{width:calc(100% - 16px);margin:0 8px 10px;padding:9px;border-radius:9px;border:1px dashed var(--line-strong);
    background:transparent;color:var(--ink-soft);font-size:12.5px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:7px}
  .newbtn:hover{border-color:var(--accent);color:var(--accent)}

  /* ---------- MAIN ---------- */
  main{min-width:0}
  section.step{display:none;animation:fade .28s ease}
  section.step.on{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .stephead{margin-bottom:18px}
  .eyebrow{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .eyebrow .n{font-family:'JetBrains Mono';font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.04em}
  .eyebrow .rule{height:1px;flex:1;background:var(--line)}
  .eyebrow .cnt{font-family:'JetBrains Mono';font-size:10.5px;color:var(--ink-faint)}
  .stephead h1{font-family:'Space Grotesk';font-size:clamp(23px,3.4vw,31px);font-weight:700;letter-spacing:-.02em;line-height:1.08}
  .stephead p.sub{color:var(--ink-soft);font-size:14px;margin-top:6px;max-width:60ch}

  /* fields */
  .field{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 17px;margin-bottom:12px;transition:border-color .2s}
  .field.filled{border-color:#B9D9C9}
  .field .fh{display:flex;align-items:flex-start;gap:12px;margin-bottom:9px}
  .field .fcode{font-family:'JetBrains Mono';font-size:10px;font-weight:700;color:var(--ink-faint);background:var(--paper);border:1px solid var(--line);padding:3px 6px;border-radius:6px;flex-shrink:0;margin-top:1px}
  .field.filled .fcode{color:var(--green);border-color:#B9D9C9;background:#EEF7F2}
  .field .fmeta{flex:1;min-width:0}
  .field .flab{font-family:'Space Grotesk';font-weight:600;font-size:15px;line-height:1.25}
  .field .fhint{font-size:12.5px;color:var(--ink-soft);margin-top:3px;line-height:1.45}
  .field .fhint b{color:var(--amber);font-weight:600}
  .rate{display:flex;gap:4px;flex-shrink:0}
  .rate button{width:22px;height:22px;border-radius:6px;background:var(--paper);border:1px solid var(--line);font-family:'JetBrains Mono';font-size:11px;font-weight:600;color:var(--ink-faint);line-height:0}
  .rate button:hover{border-color:var(--accent)}
  .rate button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
  textarea,input,select{font-family:inherit;font-size:14px;color:var(--ink);width:100%;background:var(--paper);border:1px solid var(--line);border-radius:9px;padding:10px 12px;transition:.15s}
  textarea:focus,input:focus,select:focus{outline:none;border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(42,59,212,.1)}
  textarea{resize:vertical;min-height:58px;line-height:1.5}
  textarea::placeholder,input::placeholder{color:var(--ink-faint)}

  /* identity grid */
  .idgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  .idgrid .cell.full{grid-column:1/-1}
  label.lbl{display:block;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:6px}
  .catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:9px;margin-top:2px}
  .catchip{background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:13px 10px;display:flex;flex-direction:column;align-items:center;gap:7px;text-align:center;transition:.15s}
  .catchip:hover{border-color:var(--line-strong);transform:translateY(-1px)}
  .catchip.sel{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px rgba(42,59,212,.1)}
  .catchip svg{width:22px;height:22px;color:var(--ink-soft)}
  .catchip.sel svg{color:var(--accent)}
  .catchip span{font-size:12px;font-weight:600;line-height:1.15}

  /* synthèse */
  .synthgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
  .likecard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px 16px}
  .likecard h4{font-family:'Space Grotesk';font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;margin-bottom:11px}
  .likecard.pos h4 .dot{color:var(--green)}
  .likecard.neg h4 .dot{color:var(--amber)}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:500;padding:5px 8px 5px 10px;border-radius:20px;background:var(--paper);border:1px solid var(--line)}
  .likecard.pos .chip{border-color:#B9D9C9;background:#EEF7F2}
  .likecard.neg .chip{border-color:#F0D6BE;background:#FBF1E7}
  .chip button{background:transparent;line-height:0;color:var(--ink-faint);padding:0}
  .chip button:hover{color:var(--amber)}
  .addrow{display:flex;gap:7px}
  .addrow input{font-size:13px;padding:8px 10px}
  .addrow button{flex-shrink:0;width:36px;border-radius:8px;background:var(--ink);color:#fff;font-size:17px;line-height:0}
  .addrow button:hover{background:var(--accent)}

  .verdictcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px 17px;margin-bottom:12px}
  .verdictcard .flab{font-family:'Space Grotesk';font-weight:600;font-size:15px;margin-bottom:9px}
  .scorewrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .scorebtns{display:flex;gap:5px;flex-wrap:wrap}
  .scorebtns button{min-width:40px;padding:9px 6px;border-radius:8px;background:var(--paper);border:1px solid var(--line);font-family:'JetBrains Mono';font-weight:700;font-size:13px;color:var(--ink-soft)}
  .scorebtns button:hover{border-color:var(--accent)}
  .scorebtns button.sel{background:var(--accent);border-color:var(--accent);color:#fff}
  .scoreval{font-family:'Space Grotesk';font-weight:700;font-size:30px;letter-spacing:-.02em}
  .scoreval small{font-size:15px;color:var(--ink-faint);font-weight:500}

  /* footer nav */
  .stepnav{display:flex;justify-content:space-between;align-items:center;margin-top:20px;gap:12px}
  .stepnav .btn.solid.wide{padding:11px 20px}
  .stepnav .prevb{background:transparent;color:var(--ink-soft);border:1px solid var(--line-strong);padding:10px 16px;border-radius:9px;font-size:13px;font-weight:600;display:inline-flex;gap:7px;align-items:center}
  .stepnav .prevb:hover{border-color:var(--ink-soft);color:var(--ink)}
  .stepnav .prevb.hidden{visibility:hidden}

  /* modal */
  .modal{position:fixed;inset:0;z-index:60;background:rgba(20,22,28,.5);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:20px;animation:fade .2s}
  .modal.on{display:flex}
  .modalbox{background:var(--card);border-radius:16px;box-shadow:0 20px 60px -20px rgba(0,0,0,.4);width:min(720px,100%);max-height:86vh;display:flex;flex-direction:column;overflow:hidden}
  .modalhead{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px}
  .modalhead h3{font-family:'Space Grotesk';font-size:16px;font-weight:700;flex:1}
  .modalhead .x{background:var(--paper);border-radius:8px;padding:6px;line-height:0;color:var(--ink-soft)}
  .modalhead .x:hover{background:var(--line)}
  .modalbody{padding:16px 20px;overflow:auto}
  .modalbody textarea{min-height:300px;font-family:'JetBrains Mono';font-size:12px;line-height:1.6;background:var(--paper)}
  .modalfoot{padding:14px 20px;border-top:1px solid var(--line);display:flex;gap:9px;justify-content:flex-end;align-items:center}
  .modalfoot .hint{font-size:12px;color:var(--ink-faint);margin-right:auto}

  /* toast */
  .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);z-index:80;
    background:var(--ink);color:#fff;padding:11px 18px;border-radius:11px;font-size:13.5px;font-weight:500;
    box-shadow:0 12px 30px -10px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:.28s;display:flex;align-items:center;gap:9px}
  .toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
  .toast svg{width:16px;height:16px;color:#7CE0B5}

  .empty{color:var(--ink-faint);font-size:12.5px;padding:4px 2px 8px}

  @media(max-width:860px){
    .wrap{grid-template-columns:1fr;padding-bottom:80px}
    aside{position:static;order:2}
    .navcard.pillars{order:-1}
    .prog{display:none}
    .topbar .ident{display:none}
    .idgrid,.synthgrid{grid-template-columns:1fr}
  }
  @media(max-width:480px){
    .actions .btn.ghost span{display:none}
    .btn{padding:8px 11px}
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <div class="glyph"><b>B</b></div>
    <div class="wm">
      <div class="t">BANC D'ESSAI</div>
      <div class="s">Protocole de test</div>
    </div>
  </div>
  <div class="ident">
    <span class="prod" id="identProd"><span class="ph">Nouveau test</span></span>
    <span class="cat" id="identCat"></span>
  </div>
  <div class="prog" title="Complétion du protocole">
    <div class="bar"><i id="progBar"></i></div>
    <span class="pct mono" id="progPct">0%</span>
  </div>
  <div class="actions">
    <button class="btn ghost" id="resetBtn" title="Repartir de zéro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg><span>Réinitialiser</span></button>
    <button class="btn solid" id="exportBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Exporter .md</button>
  </div>
</header>

<div class="wrap">
  <aside>
    <div class="navcard drafts">
      <h3>Mes tests</h3>
      <div class="navlist" id="draftList"></div>
      <button class="newbtn" id="newBtn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>Nouveau test</button>
    </div>
    <div class="navcard pillars">
      <h3>Protocole</h3>
      <div class="navlist" id="stepNav"></div>
    </div>
  </aside>

  <main id="main"><!-- steps injected --></main>
</div>

<!-- Export modal -->
<div class="modal" id="modal">
  <div class="modalbox">
    <div class="modalhead">
      <h3>Notes de test — Markdown</h3>
      <button class="x" id="modalX"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
    </div>
    <div class="modalbody">
      <textarea id="mdOut" spellcheck="false" readonly></textarea>
    </div>
    <div class="modalfoot">
      <span class="hint">À coller dans votre IA de rédaction, ou téléchargé en <b>.md</b>.</span>
      <button class="btn ghost" id="copyBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copier</button>
      <button class="btn solid" id="dlBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Télécharger</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M20 6 9 17l-5-5"/></svg><span id="toastMsg"></span></div>

<script>
/* =========================================================
   MODÈLE DE DONNÉES — catégories → piliers → champs
   Chaque champ : { code, label, hint }
   ========================================================= */
const ICONS = {
  smartphone:'<rect x="7" y="2" width="10" height="20" rx="2.5"/><path d="M11 18h2"/>',
  laptop:'<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M2 20h20"/>',
  audio:'<path d="M4 14v-2a8 8 0 0 1 16 0v2"/><rect x="2" y="14" width="5" height="7" rx="1.5"/><rect x="17" y="14" width="5" height="7" rx="1.5"/>',
  watch:'<rect x="6" y="6" width="12" height="12" rx="3"/><path d="M9 6 8 2h8l-1 4M9 18l-1 4h8l-1-4"/>',
  tablet:'<rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="M10 18h4"/>',
  tv:'<rect x="2" y="4" width="20" height="13" rx="2"/><path d="M8 21h8M12 17v4"/>',
  speaker:'<rect x="5" y="2" width="14" height="20" rx="3"/><circle cx="12" cy="15" r="3.5"/><circle cx="12" cy="7" r="1"/>',
  other:'<path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5M2 12l10 5 10-5"/>'
};

const CATEGORIES = {
  smartphone:{ label:"Smartphone", icon:ICONS.smartphone, pillars:[
    {name:"Design & Ergonomie", fields:[
      {label:"Matériaux & finition", hint:"Verre, métal, plastique ? Qualité d'assemblage, jeux dans les assemblages. <b>Piège : distinguer le ressenti premium du simple effet marketing.</b>"},
      {label:"Poids & équilibre", hint:"Pèse-t-il lourd en main ? Bon centre de gravité ? Comparez à un modèle connu du même segment."},
      {label:"Prise en main à une main", hint:"Atteint-on le haut de l'écran au pouce ? Bords glissants ? Tenue avec/sans coque."},
      {label:"Boutons & tranches", hint:"Course des boutons, position, bouton d'action éventuel. Tiroir SIM, port USB-C."},
      {label:"Résistance & robustesse", hint:"Indice IP (eau/poussière), type de verre, résistance aux rayures. <b>Ne jamais affirmer sans la fiche technique.</b>"},
    ]},
    {name:"Écran", fields:[
      {label:"Technologie & définition", hint:"OLED / LCD, taille en pouces, définition. Piqué à l'usage."},
      {label:"Taux de rafraîchissement", hint:"60/90/120 Hz, adaptatif (LTPO) ? <b>Vérifiez qu'il tient réellement le 120 Hz partout, pas qu'en réglages.</b>"},
      {label:"Luminosité en plein soleil", hint:"Lisible dehors ? Testez en extérieur, pas seulement en intérieur. Notez le pic annoncé vs ressenti."},
      {label:"Colorimétrie & modes", hint:"Couleurs justes ou saturées ? Profils disponibles, température, always-on display."},
      {label:"Tactile & fluidité", hint:"Réactivité, rejet de paume, sensibilité avec doigts humides."},

/* =========================================================
   ÉTAT & PERSISTANCE
   ========================================================= */
const $ = s => document.querySelector(s);
const store = { // wrapper tolérant : window.storage sinon mémoire
  mem:{},
  ok: (typeof window!=="undefined" && window.storage && typeof window.storage.get==="function"),
  async get(k){ if(!this.ok) return this.mem[k]??null; try{const r=await window.storage.get(k);return r?r.value:null;}catch(e){return null;} },
  async set(k,v){ if(!this.ok){this.mem[k]=v;return;} try{await window.storage.set(k,v);}catch(e){} },
  async del(k){ if(!this.ok){delete this.mem[k];return;} try{await window.storage.delete(k);}catch(e){} },
};
const IDX_KEY="be:index";
const ITEM=id=>"be:item:"+id;

let state=null, activeStep=0, saveTimer=null;

function blankState(){
  return { id:"t_"+Date.now().toString(36)+Math.random().toString(36).slice(2,6),
    category:null, marque:"", modele:"", prix:"", config:"", date:new Date().toISOString().slice(0,10),
    testeur:"", fields:{}, ratings:{}, likes:[], dislikes:[], verdict:"", pourqui:"", note:null,
    updated:Date.now() };
}
function pillarsOf(){ return state.category ? CATEGORIES[state.category].pillars : []; }
function fieldKey(p,f){ return "p"+p+"f"+f; }
function fieldCode(cat,p,f){
  const pref=(CATEGORIES[cat]?.label||"GEN").slice(0,3).toUpperCase().replace(/[^A-Z]/g,'X');
  return pref+"-"+String(p+1).padStart(2,'0')+String.fromCharCode(97+f).toUpperCase();
}

/* completion */
function pillarStats(pi){
  const p=pillarsOf()[pi]; let filled=0;
  p.fields.forEach((f,fi)=>{ if((state.fields[fieldKey(pi,fi)]||"").trim()) filled++; });
  return {filled,total:p.fields.length};
}
function totalPct(){
  const ps=pillarsOf(); if(!ps.length) return 0;
  let f=0,t=0; ps.forEach((_,pi)=>{const s=pillarStats(pi);f+=s.filled;t+=s.total;});
  const idFilled = state.marque.trim()&&state.modele.trim()?1:0;
  const synthFilled = (state.likes.length||state.dislikes.length||state.verdict.trim()||state.note!=null)?1:0;
  t+=2; f+=idFilled+synthFilled;
  return t?Math.round(f/t*100):0;
}

/* =========================================================
   RENDU
   ========================================================= */
function stepDefs(){
  // 0 = identité, 1..n = piliers, dernier = synthèse
  const defs=[{type:"ident",label:"Identité produit"}];
  pillarsOf().forEach((p,i)=>defs.push({type:"pillar",label:p.name,pi:i}));
  defs.push({type:"synth",label:"Verdict & synthèse"});
  return defs;
}

function renderNav(){
  const defs=stepDefs(), nav=$("#stepNav"); nav.innerHTML="";
  defs.forEach((d,i)=>{
    let done=false, ratio=0;
    if(d.type==="ident"){ done=!!(state.marque.trim()&&state.modele.trim()); ratio=done?1:0; }
    else if(d.type==="pillar"){ const s=pillarStats(d.pi); ratio=s.total?s.filled/s.total:0; done=ratio===1; }
    else { done=!!(state.verdict.trim()||state.note!=null||state.likes.length||state.dislikes.length); ratio=done?1:0; }
    const b=document.createElement("button");
    b.className="navitem"+(i===activeStep?" active":"")+(done?" done":"");
    b.innerHTML=`<span class="idx mono">${d.type==="ident"?"00":d.type==="synth"?"★":String(d.pi+1).padStart(2,'0')}</span>
      <span class="lab">${d.label}</span>
      <span class="gge"><i style="width:${Math.round(ratio*100)}%"></i></span>
      <svg class="chk" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M20 6 9 17l-5-5"/></svg>`;
    b.onclick=()=>{ activeStep=i; render(); window.scrollTo({top:0,behavior:'smooth'}); };
    nav.appendChild(b);
  });
}

function renderProgress(){
  const pct=totalPct();
  $("#progBar").style.width=pct+"%"; $("#progPct").textContent=pct+"%";
  const pr=$("#identProd"), pc=$("#identCat");
  if(state.marque.trim()||state.modele.trim()){
    pr.innerHTML=`${escapeHtml(state.marque)} ${escapeHtml(state.modele)}`.trim();
  } else pr.innerHTML='<span class="ph">Nouveau test</span>';
  pc.textContent=state.category?("· "+CATEGORIES[state.category].label):"";
}

function render(){
  const defs=stepDefs();
  if(activeStep>=defs.length) activeStep=defs.length-1;
  const d=defs[activeStep];
  const main=$("#main"); main.innerHTML="";
  const sec=document.createElement("section"); sec.className="step on";

  if(d.type==="ident") sec.innerHTML=identHTML();
  else if(d.type==="pillar") sec.innerHTML=pillarHTML(d.pi);
  else sec.innerHTML=synthHTML();

  sec.innerHTML+=stepnavHTML(defs.length);
  main.appendChild(sec);
  bindStep(d);
  bindStepnav();
  renderNav(); renderProgress();
}

  return `<div class="stephead">
      <div class="eyebrow"><span class="n">00 · SETUP</span><span class="rule"></span></div>
      <h1>Identité du produit</h1>

        <div class="cell"><label class="lbl">Date du test</label><input id="f_date" type="date" value="${escapeAttr(state.date)}"></div>
        <div class="cell"><label class="lbl">Testeur</label><input id="f_testeur" placeholder="Votre nom" value="${escapeAttr(state.testeur)}"></div>
      </div>
    </div>
    ${disabled?'<p class="empty">Sélectionnez une catégorie pour débloquer le protocole de test →</p>':''}`;
}

function pillarHTML(pi){
  const p=pillarsOf()[pi], s=pillarStats(pi);
  const fields=p.fields.map((f,fi)=>{
    const key=fieldKey(pi,fi), val=state.fields[key]||"", rate=state.ratings[key]||null;
    const code=fieldCode(state.category,pi,fi);
    const rbtns=[1,2,3,4,5].map(n=>`<button data-rate="${key}" data-n="${n}" class="${rate===n?'sel':''}">${n}</button>`).join("");
    return `<div class="field${val.trim()?' filled':''}">
      <div class="fh">
        <span class="fcode">${code}</span>
        <div class="fmeta"><div class="flab">${f.label}</div><div class="fhint">${f.hint}</div></div>
        <div class="rate" title="Note du critère (1-5)">${rbtns}</div>
      </div>
      <textarea data-field="${key}" placeholder="Vos observations concrètes, chiffres, comparaisons…">${escapeHtml(val)}</textarea>
    </div>`;
  }).join("");
  return `<div class="stephead">
      <div class="eyebrow"><span class="n">${String(pi+1).padStart(2,'0')} · PILIER</span><span class="rule"></span><span class="cnt mono">${s.filled}/${s.total}</span></div>
      <h1>${p.name}</h1>
      <p class="sub">Notez des faits vérifiables : chaque observation nourrira une affirmation prouvée dans l'article.</p>
    </div>${fields}`;
}

function synthHTML(){
  const likes=state.likes.map((t,i)=>chipHTML(t,i,'like')).join("")||'<span class="empty">Aucun point fort ajouté.</span>';
  const dislikes=state.dislikes.map((t,i)=>chipHTML(t,i,'dislike')).join("")||'<span class="empty">Aucun point faible ajouté.</span>';
  const scores=[];for(let n=0;n<=10;n+=0.5){scores.push(`<button data-score="${n}" class="${state.note===n?'sel':''}">${n}</button>`);}
  return `<div class="stephead">
      <div class="eyebrow"><span class="n">★ · SYNTHÈSE</span><span class="rule"></span></div>
      <h1>Verdict & synthèse</h1>
      <p class="sub">Le condensé qui structurera la fiche : « On aime / On aime moins », note globale et recommandation.</p>
    </div>
    <div class="synthgrid">
      <div class="likecard pos"><h4><span class="dot">●</span> On aime</h4>
        <div class="chips" id="likeChips">${likes}</div>
        <div class="addrow"><input id="likeIn" placeholder="Ajouter un point fort…"><button data-add="like">+</button></div>
      </div>

    </div>

        <div class="scoreval">${state.note!=null?state.note:'—'}<small>/10</small></div>

    </div>
    <div class="verdictcard">
      <div class="flab">Verdict — faut-il l'acheter&nbsp;?</div>
      <textarea id="f_verdict" placeholder="Votre conclusion argumentée : promesse tenue ou non, à qui vous le conseillez et pourquoi.">${escapeHtml(state.verdict)}</textarea>

    </div>`;
}

function stepnavHTML(total){
  const prevHidden=activeStep===0?' hidden':'';
  const last=activeStep===total-1;
  return `<div class="stepnav">
    <button class="prevb${prevHidden}" data-nav="prev"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>Précédent</button>
    ${last
      ? `<button class="btn solid wide" data-nav="export"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Générer le fichier .md</button>`
      : `<button class="btn solid wide" data-nav="next">Suivant<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button>`}
  </div>`;
}

/* =========================================================
   BINDINGS
   ========================================================= */
function bindStep(d){
  if(d.type==="ident"){
    document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{
      const c=b.dataset.cat;
      if(state.category!==c){ state.category=c; }
      touch(); render();
    });
    bindInput("#f_marque","marque"); bindInput("#f_modele","modele");
    bindInput("#f_prix","prix"); bindInput("#f_config","config");
    bindInput("#f_date","date"); bindInput("#f_testeur","testeur");
  }
  else if(d.type==="pillar"){
    document.querySelectorAll("textarea[data-field]").forEach(t=>{
      t.oninput=()=>{ state.fields[t.dataset.field]=t.value; t.closest('.field').classList.toggle('filled',!!t.value.trim()); touch(true); };
    });
    document.querySelectorAll("[data-rate]").forEach(b=>b.onclick=()=>{
      const k=b.dataset.rate,n=+b.dataset.n;
      state.ratings[k]= state.ratings[k]===n?null:n;
      document.querySelectorAll(`[data-rate="${k}"]`).forEach(x=>x.classList.toggle('sel',+x.dataset.n===state.ratings[k]));
      touch();
    });
  }
  else if(d.type==="synth"){
    document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>addChip(b.dataset.add));
    ["like","dislike"].forEach(kind=>{ const inp=$("#"+kind+"In"); if(inp) inp.onkeydown=e=>{if(e.key==="Enter"){e.preventDefault();addChip(kind);}};});
    document.querySelectorAll("[data-remove]").forEach(b=>b.onclick=()=>{
      const arr=b.dataset.remove==="like"?state.likes:state.dislikes; arr.splice(+b.dataset.i,1); touch(); render();
    });
    document.querySelectorAll("[data-score]").forEach(b=>b.onclick=()=>{
      const v=parseFloat(b.dataset.score); state.note = state.note===v?null:v; touch(); render();
    });
    bindInput("#f_verdict","verdict"); bindInput("#f_pourqui","pourqui");
  }
}
function bindInput(sel,key){ const el=$(sel); if(!el) return; el.oninput=()=>{ state[key]=el.value; touch(true);
  if(key==="marque"||key==="modele"||key==="category") renderProgress(); }; }
function addChip(kind){
  const inp=$("#"+kind+"In"); const v=inp.value.trim(); if(!v) return;
  (kind==="like"?state.likes:state.dislikes).push(v); inp.value=""; touch(); render();
  const nx=$("#"+kind+"In"); if(nx) nx.focus();
}
function bindStepnav(){
  document.querySelectorAll("[data-nav]").forEach(b=>b.onclick=()=>{
    const a=b.dataset.nav, total=stepDefs().length;
    if(a==="prev"&&activeStep>0){activeStep--;render();window.scrollTo({top:0,behavior:'smooth'});}
    else if(a==="next"&&activeStep<total-1){activeStep++;render();window.scrollTo({top:0,behavior:'smooth'});}
    else if(a==="export"){openExport();}
  });
}

/* =========================================================
   SAUVEGARDE (debounce) + LISTE DES TESTS
   ========================================================= */
function touch(debounced){
  state.updated=Date.now();
  if(debounced){ clearTimeout(saveTimer); saveTimer=setTimeout(persist,500); }
  else persist();
  if(!debounced){ renderNav(); renderProgress(); }
}
async function persist(){
  await store.set(ITEM(state.id), JSON.stringify(state));
  let idx=await loadIndex();
  const title=(state.marque||state.modele)?`${state.marque} ${state.modele}`.trim():"Test sans titre";
  const cat=state.category?CATEGORIES[state.category].label:"—";
  const e={id:state.id,title,cat,updated:state.updated};
  const i=idx.findIndex(x=>x.id===state.id);
  if(i>=0) idx[i]=e; else idx.unshift(e);
  idx.sort((a,b)=>b.updated-a.updated);
  await store.set(IDX_KEY, JSON.stringify(idx));
  renderDrafts(idx);
}
async function loadIndex(){ const raw=await store.get(IDX_KEY); try{return raw?JSON.parse(raw):[];}catch(e){return [];} }

function renderDrafts(idx){
  const list=$("#draftList");
  if(!idx.length){ list.innerHTML='<p class="empty" style="padding:2px 10px 6px">Aucun test enregistré.</p>'; return; }
  list.innerHTML=idx.map(e=>`
    <div class="draftrow">
      <button class="draftitem${e.id===state.id?' active':''}" data-open="${e.id}">
        <span class="dt">${escapeHtml(e.title)}</span>
        <span class="dm">${escapeHtml(e.cat)} · ${fmtDate(e.updated)}</span>
      </button>
      <button class="del" data-del="${e.id}" title="Supprimer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m2 0v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg></button>
    </div>`).join("");
  list.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>openTest(b.dataset.open));
  list.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>delTest(b.dataset.del));
}
async function openTest(id){
  if(id===state.id) return;
  const raw=await store.get(ITEM(id));
  if(raw){ try{ state=JSON.parse(raw); activeStep=0; render(); toast("Test chargé"); }catch(e){} }
}
async function delTest(id){
  await store.del(ITEM(id));
  let idx=(await loadIndex()).filter(x=>x.id!==id);
  await store.set(IDX_KEY, JSON.stringify(idx));
  if(id===state.id){ state=blankState(); activeStep=0; render(); }
  renderDrafts(idx); toast("Test supprimé");
}

/* =========================================================
   EXPORT MARKDOWN
   ========================================================= */
function buildMarkdown(){
  const L=[]; const S=state;
  const prod=`${S.marque} ${S.modele}`.trim()||"Produit non nommé";
  const cat=S.category?CATEGORIES[S.category].label:"Non défini";
  L.push(`# Notes de test — ${prod}`);
  L.push("");
  L.push("> Notes brutes issues du protocole de test. À transmettre à la rédaction pour la mise en forme de l'article (titre, chapeau, corps, verdict).");
  L.push("");
  L.push("## Fiche produit");
  L.push(`- **Catégorie** : ${cat}`);
  L.push(`- **Marque** : ${S.marque||"—"}`);
  L.push(`- **Modèle** : ${S.modele||"—"}`);
  if(S.config) L.push(`- **Configuration testée** : ${S.config}`);
  L.push(`- **Prix public** : ${S.prix||"—"}`);
  L.push(`- **Date du test** : ${S.date||"—"}`);
  L.push(`- **Testeur** : ${S.testeur||"—"}`);
  if(S.note!=null) L.push(`- **Note globale** : ${S.note}/10`);
  L.push("");

  if(S.likes.length||S.dislikes.length){
    L.push("## Synthèse rapide");
    if(S.likes.length){ L.push("**On aime**"); S.likes.forEach(t=>L.push(`- ${t}`)); L.push(""); }
    if(S.dislikes.length){ L.push("**On aime moins**"); S.dislikes.forEach(t=>L.push(`- ${t}`)); L.push(""); }
  }

  L.push("## Observations par pilier");
  L.push("");
  pillarsOf().forEach((p,pi)=>{
    const s=pillarStats(pi);
    L.push(`### ${pi+1}. ${p.name}  _(${s.filled}/${s.total} renseignés)_`);
    let any=false;
    p.fields.forEach((f,fi)=>{
      const key=fieldKey(pi,fi), v=(S.fields[key]||"").trim(), r=S.ratings[key];
      if(v||r){
        any=true;
        const note=r?`  \`${r}/5\``:"";
        L.push(`- **${f.label}**${note} : ${v||"_(noté sans commentaire)_"}`);
      }
    });
    if(!any) L.push("- _Aucune observation renseignée._");
    L.push("");
  });

  if(S.verdict.trim()||S.pourqui.trim()){
    L.push("## Verdict provisoire");
    if(S.verdict.trim()) L.push(S.verdict.trim());
    if(S.pourqui.trim()){ L.push(""); L.push(`**Pour qui ?** ${S.pourqui.trim()}`); }
    L.push("");
  }

  L.push("---");
  L.push("### Consignes pour la rédaction");
  L.push("Rédige un article de test au format : **titre accrocheur**, **chapeau** (2-3 phrases avec verdict rapide), fiche **On aime / On aime moins**, **corps** découpé par pilier avec sous-titres évocateurs, puis **verdict « Faut-il l'acheter et pour qui ? »**. Ton factuel, phrases courtes, voix active. Chaque affirmation doit s'appuyer sur une observation ci-dessus ; ne rien inventer, et signaler tout point manquant plutôt que de le combler.");
  L.push("");
  return L.join("\n");
}

function openExport(){
  if(!state.category){ toast("Choisissez d'abord une catégorie"); activeStep=0; render(); return; }
  const md=buildMarkdown();
  $("#mdOut").value=md;
  $("#modal").classList.add("on");
}
function closeExport(){ $("#modal").classList.remove("on"); }

function download(){
  const md=$("#mdOut").value;
  const slug=(`${state.marque}-${state.modele}`.trim()||"test").toLowerCase()
    .normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"test";
  const blob=new Blob([md],{type:"text/markdown;charset=utf-8"});
  const url=URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=`test-${slug}.md`; document.body.appendChild(a); a.click();
  a.remove(); URL.revokeObjectURL(url); toast("Fichier .md téléchargé");
}
async function copyMd(){
  const md=$("#mdOut").value;
  try{ await navigator.clipboard.writeText(md); toast("Markdown copié"); }
  catch(e){ const t=$("#mdOut"); t.removeAttribute("readonly"); t.select(); document.execCommand("copy"); t.setAttribute("readonly","true"); toast("Markdown copié"); }
}

/* =========================================================
   UTILITAIRES
   ========================================================= */
function escapeHtml(s){return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}
function escapeAttr(s){return (s||"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function fmtDate(ts){ const d=new Date(ts); return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})+" "+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}); }
let toastTimer;
function toast(msg){ $("#toastMsg").textContent=msg; const t=$("#toast"); t.classList.add("on"); clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("on"),2200); }

/* =========================================================
   INIT
   ========================================================= */
$("#exportBtn").onclick=openExport;
$("#modalX").onclick=closeExport;
$("#modal").onclick=e=>{ if(e.target===$("#modal")) closeExport(); };
$("#dlBtn").onclick=download;
$("#copyBtn").onclick=copyMd;
$("#newBtn").onclick=()=>{ state=blankState(); activeStep=0; render(); persist(); toast("Nouveau test créé"); };
$("#resetBtn").onclick=()=>{
  if(confirm("Réinitialiser ce test ? Les observations non exportées seront perdues.")){
    const id=state.id; state=blankState(); state.id=id; activeStep=0; render(); persist(); toast("Test réinitialisé");
  }
};
document.addEventListener("keydown",e=>{ if(e.key==="Escape") closeExport(); });

(async function init(){
  const idx=await loadIndex();
  if(idx.length){ const raw=await store.get(ITEM(idx[0].id)); if(raw){ try{state=JSON.parse(raw);}catch(e){state=blankState();} } else state=blankState(); }
  else state=blankState();
  render(); renderDrafts(idx.length?idx:[]);
  if(!store.ok) toast("Sauvegarde locale indisponible ici — pensez à exporter");
})();
</script>
